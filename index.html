<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CRM Clientes | Neto Modas</title>
    
    <!-- Configuração PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#faf8f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Neto Modas CRM" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Google Fonts: Outfit (Títulos) & Inter (Corpo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Ícone Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
  </head>
  <body class="bg-surface text-slate-800 min-h-screen font-sans antialiased selection:bg-brand-200 selection:text-brand-900">
    
    <!-- Container Principal -->
    <div id="app" class="flex flex-col min-h-screen">
      <!-- Tela de Carregamento Inicial -->
      <div class="loading-screen flex flex-col items-center justify-center fixed inset-0 bg-surface z-50">
        <div class="w-12 h-12 border-4 border-brand-200 border-t-brand-500 rounded-full animate-spin mb-4"></div>
        <p class="text-slate-500 font-medium">Carregando Neto Modas...</p>
      </div>
    </div>

    <!-- Modais e Notificações (Toast) -->
    <div id="modal-root" class="hidden"></div>
    <div id="toast-root" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <script type="module" src="/src/main.js"></script>
    <script>
      // Registro do Service Worker para PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('Aviso: SW não registrado no modo dev:', err);
          });
        });
      }
    </script>
  </body>
</html>
